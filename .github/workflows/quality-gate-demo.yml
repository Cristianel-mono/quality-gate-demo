name: quality-gate-demo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      archivo:
        description: "Serie del soak a evaluar (carpeta data/)"
        default: soak_defectuoso.csv
        type: choice
        options: [soak_defectuoso.csv, soak_corregido.csv, soak_defectuoso_24min.csv]

permissions:
  contents: read

jobs:
  traceability:                     # Etapa 0: el titulo del PR cita un defecto (D-xxx) o una accion (Axx)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Titulo del PR: $PR_TITLE"
          echo "$PR_TITLE" | grep -Eq '^(D-[0-9]{3}|A[0-9]{1,2})[: ]' || { echo "El titulo debe empezar por D-xxx o Axx"; exit 1; }

  unit:                             # Etapa 1: pruebas de D-103 (IVA) y D-105 (banner)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: javac -d out src/*.java test/*.java
      - run: java -cp out PricingTest

  soak-gate:                        # Etapa 7: gate de tendencia sobre una serie del soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/soak_gate.py "data/${{ github.event_name == 'workflow_dispatch' && inputs.archivo || 'soak_corregido.csv' }}"
